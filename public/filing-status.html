<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Filing Your Claim — OwedToYou.net</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020817;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;margin-top:8px}
.logo-text{font-size:17px;font-weight:600;color:#fff}
.card{width:100%;max-width:440px;background:#0f172a;border:1px solid #1e293b;border-radius:20px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
.card-header{background:#1e3a5f;padding:20px 24px}
.card-header p{color:#93c5fd;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.card-header h1{color:#fff;font-size:20px;font-weight:700;line-height:1.3}
.card-body{padding:24px;display:flex;flex-direction:column;gap:16px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spinner{width:48px;height:48px;border:3px solid #1e293b;border-top-color:#10b981;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
.step-row{display:flex;align-items:center;gap:10px;font-size:13px;color:#64748b;animation:fadeUp 0.3s ease}
.step-check{color:#10b981;font-size:16px;flex-shrink:0}
.success-box{background:#064e3b;border:1px solid #10b981;border-radius:14px;padding:24px;text-align:center}
.success-box .emoji{font-size:36px;margin-bottom:12px}
.success-box h2{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.success-box .conf{font-size:13px;color:#6ee7b7;margin-bottom:16px}
.success-box p{font-size:13px;color:#94a3b8;margin-bottom:20px}
.pay-btn{display:block;background:#10b981;color:#fff;padding:16px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;text-align:center}
.pay-btn:hover{background:#34d399}
.no-match{background:#1e293b;border-radius:14px;padding:20px;text-align:center}
</style>
</head>
<body>

<div class="logo">
  <svg width="24" height="24" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" stroke="#10b981" stroke-width="2"/><text x="14" y="19" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700" font-family="system-ui">$</text></svg>
  <span class="logo-text">OwedToYou.net</span>
</div>

<div class="card">
  <div class="card-header">
    <p>Filing In Progress</p>
    <h1 id="header-title">We're filing your claim with the state.</h1>
  </div>
  <div class="card-body">
    <div style="text-align:center;padding:12px 0">
      <div class="spinner" id="spinner"></div>
      <div id="status-text" style="font-size:14px;color:#94a3b8;margin-top:14px">Connecting to state portal...</div>
      <div style="font-size:12px;color:#475569;margin-top:4px">You can close this tab — we'll email you when your claim is filed.</div>
    </div>
    <div id="steps" style="display:flex;flex-direction:column;gap:8px"></div>
    <div id="result"></div>
  </div>
</div>

<div style="margin-top:24px;font-size:11px;color:#334155;text-align:center">
  <a href="/privacy.html" style="color:#334155;text-decoration:none">Privacy Policy</a> &nbsp;&middot;&nbsp;
  <a href="/terms.html" style="color:#334155;text-decoration:none">Terms of Service</a>
</div>

<script>
const params   = new URLSearchParams(window.location.search);
const claimId  = params.get('claimId') || '';
const userEmail = params.get('email') || '';
const name     = params.get('name') || 'there';

const steps = [
  'Connecting to state portal...',
  'Locating your records...',
  'Verifying property ownership...',
  'Completing claim form...',
  'Submitting to state database...',
  'Awaiting confirmation...',
];

let stepIdx = 0;
const stepsEl  = document.getElementById('steps');
const statusEl = document.getElementById('status-text');

function addStep(label) {
  const div = document.createElement('div');
  div.className = 'step-row';
  div.innerHTML = `<span class="step-check">&#10003;</span><span>${label}</span>`;
  stepsEl.appendChild(div);
}

// Cycle through steps every 25 seconds while filing runs
const stepTimer = setInterval(() => {
  if (stepIdx < steps.length) {
    addStep(steps[stepIdx]);
    stepIdx++;
    if (stepIdx < steps.length) statusEl.textContent = steps[stepIdx];
  } else {
    const extras = [
      'Checking additional state records...',
      'Verifying claimant identity...',
      'Reviewing property history...',
      'Confirming submission details...',
      'Awaiting state portal response...',
      'Processing claim documents...',
    ];
    const msg = extras[(stepIdx - steps.length) % extras.length];
    addStep(msg);
    statusEl.textContent = 'Finalizing your claim...';
    stepIdx++;
  }
}, 25000);

// Poll every 8 seconds
const poll = setInterval(async () => {
  try {
    const r = await fetch('/claim-status/' + claimId);
    const s = await r.json();

    if (s.status === 'filed') {
      clearInterval(poll);
      clearInterval(stepTimer);
      showFiled(s.portalClaimId);
    } else if (s.status === 'no_match') {
      clearInterval(poll);
      clearInterval(stepTimer);
      showNoMatch();
    } else if (s.status === 'error' && s.attempts >= 5) {
      clearInterval(poll);
      clearInterval(stepTimer);
      showError();
    }
  } catch(e) { /* keep polling */ }
}, 8000);

function showFiled(portalClaimId) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('header-title').textContent = 'Your claim has been filed!';
  document.querySelector('.card-header').style.background = '#064e3b';
  document.getElementById('result').innerHTML = `
    <div class="success-box">
      <div class="emoji">🎉</div>
      <h2>Claim Filed Successfully</h2>
      <div class="conf">Confirmation #: ${portalClaimId || claimId}</div>
      <p>The state will review your claim and send your funds. Complete your $12.95 service fee to finalize.</p>
      <a href="/pay/${claimId}" class="pay-btn">Pay $12.95 to Complete →</a>
      <p style="font-size:11px;color:#475569;margin-top:12px">Confirmation also sent to ${userEmail}</p>
    </div>
  `;
}

function showNoMatch() {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('header-title').textContent = 'Search complete';
  document.getElementById('result').innerHTML = `
    <div class="no-match">
      <div style="font-size:15px;color:#94a3b8">We searched all state portals and couldn't find a claimable property in your name at this time.</div>
      <div style="font-size:13px;color:#475569;margin-top:8px">No charge. Nothing owed.</div>
    </div>
  `;
}

function showError() {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('header-title').textContent = 'Still working on your claim';
  document.getElementById('result').innerHTML = `
    <div class="no-match">
      <div style="font-size:15px;color:#94a3b8">We're still processing your claim in the background. You'll receive an email at <strong style="color:#fff">${userEmail}</strong> as soon as it's done.</div>
    </div>
  `;
}
</script>
</body>
</html>
