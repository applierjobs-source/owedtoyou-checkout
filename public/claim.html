<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unclaimed Funds Found — OwedToYou.net</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#020817;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:36px}
    .logo-text{font-size:18px;font-weight:600;color:#fff;letter-spacing:-0.3px}
    .card{width:100%;max-width:440px;background:#0f172a;border:1px solid #1e293b;border-radius:20px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)}
    .card-header{background:#059669;padding:20px 24px}
    .card-header p{color:#a7f3d0;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
    .card-header h1{color:#fff;font-size:22px;font-weight:700;line-height:1.3}
    .card-body{padding:24px;display:flex;flex-direction:column;gap:20px}
    .amount-box{background:#1e293b;border-radius:14px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}
    .amount-label{font-size:10px;color:#94a3b8;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
    .amount-value{font-size:32px;font-weight:700;color:#34d399;line-height:1}
    .emoji{font-size:36px}
    .field-label{font-size:10px;color:#94a3b8;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
    .field-value{font-size:15px;font-weight:600;color:#f1f5f9}
    .field-value.light{font-weight:400;color:#cbd5e1}
    .divider{border:none;border-top:1px solid #1e293b}
    .checklist{display:flex;flex-direction:column;gap:10px}
    .check-item{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#94a3b8}
    .check-icon{color:#34d399;flex-shrink:0;margin-top:1px}
    .check-item strong{color:#fff}
    .cta-btn{width:100%;background:#10b981;color:#fff;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:700;cursor:pointer;transition:background 0.15s;box-shadow:0 10px 30px -10px rgba(16,185,129,0.4)}
    .cta-btn:hover{background:#34d399}
    .cta-sub{text-align:center;font-size:12px;color:#475569}
    .footer{margin-top:28px;font-size:11px;color:#334155;text-align:center;max-width:340px;line-height:1.6}
    .error-state{text-align:center;color:#64748b}
    .error-state a{color:#34d399;text-decoration:underline}
    .entities-table{background:#1e293b;border-radius:12px;overflow:hidden;font-size:13px}
    .entities-header{display:flex;justify-content:space-between;padding:8px 14px;background:#0f2744;color:#64748b;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600}
    .entity-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-top:1px solid #2d3f55}
    .entity-name{color:#cbd5e1;flex:1;margin-right:12px;line-height:1.3}
    .entity-amt{color:#34d399;font-weight:700;white-space:nowrap}
    .entity-total{display:flex;justify-content:space-between;padding:10px 14px;border-top:2px solid #334155;background:#152234;color:#fff;font-weight:700;font-size:14px}
    .why-section{width:100%;max-width:440px;margin-top:20px;display:flex;flex-direction:column;gap:16px}
    .why-title{color:#fff;font-size:20px;font-weight:700;text-align:center;margin:0}
    .why-grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:600px){.why-grid{grid-template-columns:repeat(3,1fr)}}
    .why-card{background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:16px}
    .why-card-title{color:#10b981;font-size:14px;font-weight:700;margin-bottom:8px}
    .why-card-body{color:#94a3b8;font-size:13px;line-height:1.5}
    .trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media(max-width:500px){.trust-row{grid-template-columns:1fr}}
    .trust-item{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:14px 12px;color:#cbd5e1;font-size:13px;text-align:center;line-height:1.4}
    .trust-item strong{color:#10b981}
    .legal-box{background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:20px}
    .legal-title{color:#fff;font-size:15px;font-weight:700;margin-bottom:12px}
    .legal-box p{color:#64748b;font-size:12px;line-height:1.6;margin:0 0 10px}
    .legal-box p:last-child{margin-bottom:0}
  </style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4S7RB3FNTK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-4S7RB3FNTK');
</script>
<script>
(function() {
  const p = new URLSearchParams(window.location.search);
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','ref'].forEach(k => {
    if (p.get(k)) sessionStorage.setItem(k, p.get(k));
  });
})();
</script>
</head>
<body>

<div class="logo">
  <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
    <circle cx="15" cy="15" r="14" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="20" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700" font-family="system-ui">$</text>
  </svg>
  <span class="logo-text">OwedToYou.net</span>
</div>

<div id="app"></div>

<p class="footer">This is a legitimate unclaimed property recovery service. Funds are held by the state on your behalf.</p>

<script>
  function fmt(n) {
    return new Intl.NumberFormat('en-US', {style:'currency',currency:'USD'}).format(n);
  }

  function render() {
    const app = document.getElementById('app');
    // Support both ?d= query param and #hash for backwards compat
    const params = new URLSearchParams(window.location.search);
    const hash = params.get('d') || window.location.hash.replace(/^#/, '');

    if (!hash) {
      app.innerHTML = '<div class="error-state" style="max-width:440px"><p style="font-size:16px;margin-bottom:8px">This link is no longer valid.</p><a href="https://www.owedtoyou.net">Visit owedtoyou.net to search for your funds</a></div>';
      return;
    }

    let data;
    try {
      data = JSON.parse(atob(hash));
    } catch(e) {
      app.innerHTML = '<div class="error-state" style="max-width:440px"><p style="font-size:16px;margin-bottom:8px">This link is no longer valid.</p><a href="https://www.owedtoyou.net">Visit owedtoyou.net to search for your funds</a></div>';
      return;
    }

    // Support both full keys and compressed keys (n/a/c/s/h/v/e/t)
    const name     = data.name    || data.n;
    const address  = data.address || data.a;
    const city     = data.city    || data.c;
    const state    = data.state   || data.s;
    const holder   = data.holder  || data.h;
    const amount   = data.amount  || data.v;
    const entities = data.e || [{ h: holder, v: amount }];
    const total    = data.t || data.v || amount || 0;
    const amtFmt = fmt(amount);

    app.innerHTML = `
      <div class="card">
        <div class="card-header">
          <p>Unclaimed Funds Found</p>
          <h1>${name}, you have money waiting.</h1>
        </div>
        <div class="card-body">
          <div class="amount-box">
            <div>
              <div class="amount-label">Total unclaimed funds found</div>
              <div class="amount-value">${fmt(total)}</div>
            </div>
            <div class="emoji">💰</div>
          </div>
          <div>
            <div class="field-label">Property address on file</div>
            <div class="field-value light">${address}, ${city}, ${state}</div>
          </div>
          <div>
            <div class="field-label">Unclaimed property records</div>
            <div class="entities-table">
              <div class="entities-header"><span>Held By</span><span>Amount</span></div>
              ${entities.map(e => `<div class="entity-row"><span class="entity-name">${e.h}</span><span class="entity-amt">${fmt(e.v)}</span></div>`).join('')}
              ${entities.length > 1 ? `<div class="entity-total"><span>Total</span><span>${fmt(total)}</span></div>` : ''}
            </div>
          </div>
          <hr class="divider"/>
          <div class="checklist">
            <div class="check-item"><span class="check-icon">✓</span><span>We file all the paperwork on your behalf</span></div>
            <div class="check-item"><span class="check-icon">✓</span><span>Flat fee of <strong>$12.95</strong> — no hidden costs</span></div>
            <div class="check-item"><span class="check-icon">✓</span><span>Full refund if we don't recover anything</span></div>
            <div class="check-item"><span class="check-icon">✓</span><span>Takes about 90 seconds to get started</span></div>
          </div>
          <button class="cta-btn" id="claim-btn" onclick="startCheckout(this, '${fmt(total)}')">Claim My ${fmt(total)} →</button>
          <p class="cta-sub">You'll be taken to a secure Stripe checkout page.</p>
        </div>
      </div>

      <!-- Why Choose Us -->
      <div class="why-section">
        <h2 class="why-title">Why Choose Us</h2>
        <div class="why-grid">
          <div class="why-card">
            <div class="why-card-title">Fast Turnaround</div>
            <div class="why-card-body">We file your claim package quickly so you can move from uncertainty to action in minutes, not days.</div>
          </div>
          <div class="why-card">
            <div class="why-card-title">Paperwork Experts</div>
            <div class="why-card-body">Our team prepares the required forms and supporting details to reduce rejection risk and rework.</div>
          </div>
          <div class="why-card">
            <div class="why-card-title">Secure by Design</div>
            <div class="why-card-body">Payments are handled through Stripe and sensitive information is kept to only what is needed to process your request.</div>
          </div>
        </div>
        <div class="trust-row">
          <div class="trust-item"><strong>10,000+</strong> successful claims initiated</div>
          <div class="trust-item"><strong>A+ support</strong> with real email follow-up</div>
          <div class="trust-item"><strong>No subscription</strong> one-time checkout only</div>
        </div>
        <div class="legal-box">
          <div class="legal-title">Terms and Conditions</div>
          <p>By using this service, you authorize us to assist with preparing your unclaimed property claim paperwork based on the information you provide. We do not guarantee a specific recovery amount or approval timeline from state agencies.</p>
          <p>The $12.95 fee covers document preparation and processing support. This is a one-time charge and not a subscription. Refund requests are reviewed case-by-case within 14 days of purchase.</p>
        </div>
        <div class="legal-box">
          <div class="legal-title">Privacy Policy</div>
          <p>We collect only the information required to prepare your paperwork and provide customer support. Payment data is processed by Stripe and is not stored on our servers.</p>
          <p>We do not sell your personal information. We may use trusted service providers for hosting and operations, such as GitHub and Railway, under confidentiality and security controls.</p>
        </div>
      </div>
    `;
  }

  render();
  window.addEventListener('hashchange', render);

  function showWaitlist(btn, amtFmt) {
    const container = btn.parentElement;
    container.innerHTML = `
      <div style="background:#0f2a1a;border:1px solid #166534;border-radius:14px;padding:24px;text-align:center">
        <div style="font-size:20px;font-weight:700;color:#10b981;margin-bottom:8px">We're at capacity</div>
        <p style="color:#94a3b8;font-size:14px;margin-bottom:20px;line-height:1.5">We're currently processing existing orders. Join the waitlist and we'll email you as soon as we reopen.</p>
        <div style="display:flex;gap:8px;max-width:400px;margin:0 auto">
          <input id="waitlist-email" type="email" placeholder="your@email.com" style="flex:1;background:#1e3a5f;border:1px solid #1e3a5f;border-radius:10px;padding:12px 14px;color:#fff;font-size:15px;outline:none" />
          <button onclick="submitWaitlist()" style="background:#10b981;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap">Join</button>
        </div>
        <div id="waitlist-msg" style="margin-top:12px;font-size:13px;color:#10b981;display:none">You're on the list. We'll be in touch soon.</div>
      </div>
    `;
  }

  async function submitWaitlist() {
    const emailVal = document.getElementById('waitlist-email').value.trim();
    if (!emailVal) return;
    await fetch('/waitlist', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: emailVal }) });
    document.getElementById('waitlist-msg').style.display = 'block';
  }

  async function startCheckout(btn, amtFmt) {
    btn.disabled = true;
    btn.textContent = 'Loading secure checkout...';
    gtag('event', 'begin_checkout', { currency: 'USD', value: 12.95 });
    try {
      const res = await fetch('/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      if (res.status === 503) { showWaitlist(btn, amtFmt); return; }
      const data = await res.json();
      if (data.url) {
        window.location.href = data.url;
      } else {
        btn.disabled = false;
        btn.textContent = 'Claim My ' + amtFmt + ' →';
      }
    } catch(e) {
      btn.disabled = false;
      btn.textContent = 'Claim My ' + amtFmt + ' →';
    }
  }
</script>
</body>
</html>
